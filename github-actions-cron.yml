# CFDNS 定时同步（GitHub Actions → Vercel 执行 API）
#
# 用法：
#   1. 在仓库 Settings → Secrets and variables → Actions 里添加
#        CFDNS_URL    你的 Vercel 站点地址，例如 https://cfdns-xxx.vercel.app
#        CRON_SECRET  与 Vercel 环境变量里 CRON_SECRET 相同的值
#   2. 把本文件复制到 .github/workflows/cfdns-cron.yml
#
# 注意：GitHub 计划任务最快 5 分钟一次，且高峰期可能延迟几分钟，属于正常现象。

name: cfdns-sync

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

concurrency:
  group: cfdns-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 触发同步
        env:
          CFDNS_URL: ${{ secrets.CFDNS_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail

          if [ -z "${CFDNS_URL:-}" ] || [ -z "${CRON_SECRET:-}" ]; then
            echo "缺少 CFDNS_URL 或 CRON_SECRET 仓库密钥"
            exit 1
          fi

          body=$(curl -sS -X POST "${CFDNS_URL%/}/api/run" \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "Content-Type: application/json" \
            --max-time 120)

          echo "$body" | jq -r '.summary // .error // "无返回内容"'
          echo "--- 执行日志 ---"
          echo "$body" | jq -r '.logs[]?' | head -n 100

          # ok=false（有失败项）时让工作流变红
          echo "$body" | jq -e '.ok == true' > /dev/null
